<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Immediate Meta Refresh Redirect -->
<meta http-equiv="refresh" content="0; url=https://portfolioankit.duckdns.org/">
<link rel="canonical" href="https://portfolioankit.duckdns.org/">

<!-- SEO & Social Meta Tags -->
<title>Redirecting to Ankit Verma's New Portfolio...</title>
<meta name="description" content="Ankit Verma's personal developer portfolio and AI assistant have moved to https://portfolioankit.duckdns.org/">
<meta property="og:title" content="Ankit Verma | Portfolio Moved">
<meta property="og:description" content="Ankit Verma's developer portfolio & AI agent have moved to https://portfolioankit.duckdns.org/">
<meta property="og:url" content="https://portfolioankit.duckdns.org/">
<meta property="og:type" content="website">

<!-- Instant JavaScript Redirect -->
<script>
  (function() {
    var newUrl = "https://portfolioankit.duckdns.org/" + window.location.search + window.location.hash;
    window.location.replace(newUrl);
  })();
</script>

<style>
  :root {
    --bg: #090d16;
    --card-bg: rgba(18, 24, 38, 0.85);
    --border: rgba(255, 255, 255, 0.1);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.25);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    overflow: hidden;
    position: relative;
  }

  /* Dynamic background grid & glowing ambient light */
  body::before {
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
  }

  .redirect-card {
    position: relative;
    z-index: 1;
    background: var(--card-bg);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 3rem 2.5rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 9999px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.25);
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 1.5rem;
  }

  .badge-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.3); }
  }

  h1 {
    font-size: 1.85rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 0.9rem 1.5rem;
    border-radius: 12px;
    background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
    color: #ffffff;
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
    transition: all 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(2, 132, 199, 0.45);
  }

  .btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.2s ease;
  }

  .btn:hover svg {
    transform: translateX(4px);
  }

  .target-url {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    word-break: break-all;
  }

  .target-url a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="redirect-card">
  <div class="badge">
    <span class="badge-pulse"></span>
    Website Relocated
  </div>
  
  <h1>We've Moved!</h1>
  <p>Ankit Verma's personal portfolio & AI Assistant are now hosted on dedicated cloud infrastructure.</p>

  <a href="https://portfolioankit.duckdns.org/" id="redirect-btn" class="btn">
    <span>Go to New Site Now</span>
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
    </svg>
  </a>

  <div class="target-url">
    Destination: <a href="https://portfolioankit.duckdns.org/">https://portfolioankit.duckdns.org/</a>
  </div>
</div>

<script>
  // Fallback redirect trigger
  setTimeout(function() {
    window.location.href = "https://portfolioankit.duckdns.org/";
  }, 100);
</script>
</body>
</html>
